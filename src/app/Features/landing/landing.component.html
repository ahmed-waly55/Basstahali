<app-hero></app-hero>

<app-section-header title="المراحل التعليمية" />



<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 p-4 container m-auto">
  
  <app-education-card 
    title="إبتدائي" 
    subtitle="من الصف الأول حتى السادس" 
    imageSrc="images/edu-2.webp"
    (explore)="onSelectStage('primary')">
  </app-education-card>

  <!-- كارت إعدادي باللون الصفراوي الفاتح مثل الصورة -->
  <app-education-card 
    title="إعدادي" 
    subtitle="من الصف الأول حتى الثالث" 
    imageSrc="images/edu-2.webp"
    bgColor="bg-[#fff9eb]"
    (explore)="onSelectStage('prep')">
  </app-education-card>

  <app-education-card 
    title="ثانوي" 
    subtitle="من الصف الأول حتى الثالث" 
    imageSrc="images/edu-2.webp"
    (explore)="onSelectStage('secondary')">
  </app-education-card>

  <app-education-card 
    title="قدرات خاصة" 
    subtitle="تدريبات واختبارات لقدراتك" 
    imageSrc="images/edu-2.webp"
    (explore)="onSelectStage('special')">
  </app-education-card>

</div>


<app-section-header title="مميزات المنصة " />



<section class="container mx-auto p-4">
  <div class="bg-[#f5f3ff] rounded-3xl p-6 md:p-8 shadow-sm border border-purple-100/50">
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 md:gap-4 divide-y md:divide-y-0 md:divide-x md:divide-x-reverse divide-purple-200/60">
      
      <!-- 1. جدول الحصص -->
      <div class="flex flex-col items-center text-center p-3 space-y-3 pt-4 md:pt-0">
        <div class="w-12 h-12 flex items-center justify-center text-purple-800 text-3xl">
          <i class="fa-solid fa-calendar-days"></i>
        </div>
        <h4 class="text-base font-bold text-indigo-950">جدول الحصص</h4>
        <p class="text-xs font-medium text-purple-900/70 leading-relaxed max-w-[140px]">جمع حصصك في مكان واحد</p>
      </div>

      <!-- 2. إشعارات ذكية -->
      <div class="flex flex-col items-center text-center p-3 space-y-3 pt-4 md:pt-0">
        <div class="w-12 h-12 flex items-center justify-center text-purple-800 text-3xl">
          <i class="fa-solid fa-bell"></i>
        </div>
        <h4 class="text-base font-bold text-indigo-950">إشعارات ذكية</h4>
        <p class="text-xs font-medium text-purple-900/70 leading-relaxed max-w-[140px]">تذكير قبل الحصة والواجبات</p>
      </div>

      <!-- 3. رفع الواجبات -->
      <div class="flex flex-col items-center text-center p-3 space-y-3 pt-4 md:pt-0">
        <div class="w-12 h-12 flex items-center justify-center text-purple-800 text-3xl">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <h4 class="text-base font-bold text-indigo-950">رفع الواجبات</h4>
        <p class="text-xs font-medium text-purple-900/70 leading-relaxed max-w-[140px]">رفع سهل وسريع لواجباتك</p>
      </div>

      <!-- 4. تصحيح إلكتروني -->
      <div class="flex flex-col items-center text-center p-3 space-y-3 pt-4 md:pt-0">
        <div class="w-12 h-12 flex items-center justify-center text-purple-800 text-3xl">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h4 class="text-base font-bold text-indigo-950">تصحيح إلكتروني</h4>
        <p class="text-xs font-medium text-purple-900/70 leading-relaxed max-w-[140px]">تصحيح دقيق وسريع مع الملاحظات</p>
      </div>

      <!-- 5. متابعة ولي الأمر -->
      <div class="flex flex-col items-center text-center p-3 space-y-3 pt-4 md:pt-0">
        <div class="w-12 h-12 flex items-center justify-center text-purple-800 text-3xl">
          <i class="fa-solid fa-user-group"></i>
        </div>
        <h4 class="text-base font-bold text-indigo-950">متابعة ولي الأمر</h4>
        <p class="text-xs font-medium text-purple-900/70 leading-relaxed max-w-[140px]">تقارير مفصلة لولي الأمر</p>
      </div>

      <!-- 6. تقارير أداء -->
      <div class="flex flex-col items-center text-center p-3 space-y-3 pt-4 md:pt-0">
        <div class="w-12 h-12 flex items-center justify-center text-purple-800 text-3xl">
          <i class="fa-solid fa-chart-simple"></i>
        </div>
        <h4 class="text-base font-bold text-indigo-950">تقارير أداء</h4>
        <p class="text-xs font-medium text-purple-900/70 leading-relaxed max-w-[140px]">تحليل شامل لأدائك وتطورك</p>
      </div>

    </div>
  </div>
</section>
