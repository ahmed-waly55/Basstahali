<div
  class="min-h-screen bg-gray-100 flex items-center justify-center p-5"
  dir="rtl"
>

  <div
    class="max-w-6xl w-full bg-white rounded-[40px] shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-2"
  >


    <!-- الجزء التعريفي -->

    <div
      class="bg-gradient-to-br from-[#3D1A6D] to-[#6B35A8] text-white p-8 lg:p-14 flex flex-col justify-center relative overflow-hidden"
    >


      <!-- Shapes -->

      <div
        class="absolute -top-24 -right-24 w-72 h-72 bg-white/10 rounded-full"
      ></div>


      <div
        class="absolute bottom-0 left-0 w-64 h-64 bg-[#F9B400]/20 rounded-full blur-3xl"
      ></div>



      <!-- Logo -->

      <div
        class="w-24 h-24 bg-white/10 backdrop-blur rounded-3xl flex items-center justify-center mx-auto mb-8"
      >

        <i
          class="fa-solid fa-graduation-cap text-[#F9B400] text-5xl"
        ></i>

      </div>




      <h1
        class="text-4xl font-black text-center leading-relaxed"
      >
        مرحباً بك في بسطهالي 🚀
      </h1>



      <p
        class="text-white/80 text-center mt-5 text-lg leading-8"
      >

        منصة تعليمية تساعدك على متابعة دروسك،
        تنظيم واجباتك، والوصول إلى تجربة تعليمية أفضل.

      </p>




      <!-- Features -->

      <div class="mt-10 space-y-5">


        <div class="flex items-center gap-4">

          <div
            class="w-10 h-10 bg-[#F9B400]/20 rounded-xl flex items-center justify-center"
          >
            <i class="fa-solid fa-book text-[#F9B400]"></i>
          </div>


          <span>
            متابعة المواد الدراسية
          </span>

        </div>





        <div class="flex items-center gap-4">

          <div
            class="w-10 h-10 bg-[#F9B400]/20 rounded-xl flex items-center justify-center"
          >
            <i class="fa-solid fa-calendar-check text-[#F9B400]"></i>
          </div>


          <span>
            تنظيم الحصص والواجبات
          </span>

        </div>





        <div class="flex items-center gap-4">

          <div
            class="w-10 h-10 bg-[#F9B400]/20 rounded-xl flex items-center justify-center"
          >
            <i class="fa-solid fa-chart-line text-[#F9B400]"></i>
          </div>


          <span>
            متابعة تقدمك التعليمي
          </span>

        </div>



      </div>


    </div>









    <!-- Login Form -->

    <div
      class="p-8 lg:p-14 flex flex-col justify-center"
    >



      <div class="mb-8">


        <h2
          class="text-3xl font-black text-[#3D1A6D]"
        >
          تسجيل الدخول
        </h2>



        <p
          class="text-gray-500 mt-3"
        >
          أدخل بياناتك للوصول إلى حسابك
        </p>


      </div>





      <form
        class="space-y-5"
      >



        <!-- Email -->

        <div>

          <label
            class="block mb-2 font-bold text-gray-700"
          >
            البريد الإلكتروني
          </label>



          <div class="relative">

            <i
              class="fa-solid fa-envelope absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>



            <input
              type="email"
              placeholder="example@email.com"
              class="w-full pr-12 pl-5 py-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-[#F9B400] outline-none transition"
            />


          </div>


        </div>






        <!-- Password -->


        <div>


          <label
            class="block mb-2 font-bold text-gray-700"
          >
            كلمة المرور
          </label>



          <div class="relative">


            <i
              class="fa-solid fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>



            <input
              type="password"
              placeholder="********"
              class="w-full pr-12 pl-5 py-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-[#F9B400] outline-none transition"
            />


          </div>


        </div>







        <!-- Options -->


        <div
          class="flex justify-between items-center text-sm"
        >


          <label
            class="flex items-center gap-2 text-gray-600"
          >

            <input
              type="checkbox"
              class="accent-[#F9B400]"
            >

            تذكرني

          </label>




          <a
            href="#"
            class="text-[#3D1A6D] font-bold hover:text-[#F9B400]"
          >
            نسيت كلمة المرور؟
          </a>



        </div>








        <!-- Button -->

        <button
          type="submit"
          class="w-full bg-[#F9B400] hover:bg-yellow-500 text-black font-black py-4 rounded-2xl shadow-lg transition flex items-center justify-center gap-3"
        >

          <i
            class="fa-solid fa-right-to-bracket"
          ></i>


          تسجيل الدخول


        </button>




      </form>






      <!-- Register -->


      <div
        class="text-center mt-8 text-gray-500"
      >

        ليس لديك حساب؟


        <a
          routerLink="/auth/register"
          class="text-[#3D1A6D] font-black hover:text-[#F9B400]"
        >

          إنشاء حساب جديد

        </a>


      </div>



    </div>



  </div>


</div>
