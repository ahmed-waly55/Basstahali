<div class="toast-container" [attr.dir]="preferences.language() === 'ar' ? 'rtl' : 'ltr'">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="custom-toast-box"
      [ngClass]="toast.type"
      [attr.role]="toast.type === 'error' || toast.type === 'warning' ? 'alert' : 'status'"
      [attr.aria-live]="toast.type === 'error' || toast.type === 'warning' ? 'assertive' : 'polite'"
      aria-atomic="true"
    >
      <div class="toast-body">
        <span class="toast-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            @switch (toast.type) {
              @case ('success') {
                <circle cx="12" cy="12" r="8.5" />
                <path d="m8 12 2.5 2.5 5.5-5.5" />
              }
              @case ('error') {
                <circle cx="12" cy="12" r="8.5" />
                <path d="m9 9 6 6m0-6-6 6" />
              }
              @case ('warning') {
                <path d="M10.3 4.6a2 2 0 0 1 3.4 0l7 12.1a2 2 0 0 1-1.7 3H5a2 2 0 0 1-1.7-3z" />
                <path d="M12 9v4m0 3h.01" />
              }
              @default {
                <circle cx="12" cy="12" r="8.5" />
                <path d="M12 11v5m0-8h.01" />
              }
            }
          </svg>
        </span>

        <div class="toast-content">
          @if (toast.title) {
            <h4 class="toast-title">{{ toast.title | translate }}</h4>
          }
          <p class="toast-message">{{ toast.message | translate }}</p>
        </div>

        <button
          type="button"
          class="toast-close"
          [attr.aria-label]="
            preferences.language() === 'en' ? 'Dismiss notification' : 'إغلاق التنبيه'
          "
          (click)="toastService.remove(toast.id)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m7 7 10 10M17 7 7 17" />
          </svg>
        </button>
      </div>

      <div class="toast-progress-track" aria-hidden="true">
        <div class="toast-progress-bar"></div>
      </div>
    </div>
  }
</div>
