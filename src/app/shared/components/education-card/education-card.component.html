<div
  class="
    group
    relative
    overflow-hidden
    bg-white
    border
    border-gray-100
    rounded-2xl
    p-6
    shadow-sm
    hover:shadow-xl
    hover:shadow-[#3b236d]/10
    hover:-translate-y-1.5
    transition-all
    duration-300
    flex
    flex-col
    items-center
    text-center
    h-full
  "
  [ngClass]="borderColor()"
>

  <!-- فقاعة ديكورية بنفسجية هادئة في الزاوية -->
  <div class="absolute -top-10 -right-10 w-24 h-24 bg-[#f4f0fa] rounded-full group-hover:scale-150 transition-transform duration-500 -z-0"></div>

  <!-- الأيقونة -->
  <div
    class="
      w-20
      h-20
      rounded-2xl
      flex
      items-center
      justify-center
      mb-4
      transition-colors
      duration-300
      shadow-sm
      z-10
    "
    [ngClass]="iconBg()"
  >
    <ng-content select="[icon]">
      <svg
        class="w-10 h-10 transition-colors duration-300"
        [ngClass]="iconColor()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
        />
      </svg>
    </ng-content>
  </div>

  <!-- Badge كود المنهج -->
  @if (badge()) {
    <span class="bg-[#f4f0fa] text-[#3b236d] text-xs font-bold px-3 py-1 rounded-full mb-3 z-10 border border-[#e1d5f2]">
      {{ badge() }}
    </span>
  }

  <!-- عنوان الكارت -->
  <h2 class="text-[#3b236d] text-xl font-bold mb-3 z-10 line-clamp-1">
    {{ title() }}
  </h2>

  <!-- الوصف -->
  <p class="text-gray-500 text-sm mb-6 line-clamp-2 z-10 min-h-[40px] leading-relaxed flex-1">
    {{ subtitle() }}
  </p>

  <!-- الزرار: بنفسجي ملكي ثابت بنص أبيض وبدون هوفر -->
  <button
    (click)="onExploreClick()"
    type="button"
    class="
      w-full
      mt-auto
      font-bold
      py-3
      px-4
      rounded-xl
      shadow-sm
      z-10
      block
      text-center
      cursor-pointer
    "
    [ngClass]="[buttonBg(), buttonTextColor()]"
  >
    {{ buttonText() }}
  </button>

  <!-- خط سفلي اختياري -->
  @if (showBottomLine()) {
    <div class="absolute bottom-0 left-0 h-1 w-full" [ngClass]="lineColor()"></div>
  }

</div>
