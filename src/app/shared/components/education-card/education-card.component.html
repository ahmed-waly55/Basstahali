<div
    class="group relative overflow-hidden rounded-[32px] bg-white border border-slate-200 p-8 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 min-h-[320px] flex flex-col"
    [ngClass]="borderColor()">

    <!-- Glow -->

    <div
        class="absolute -left-12 -top-12 w-44 h-44 rounded-full blur-3xl opacity-20"
        [ngClass]="glowColor()">
    </div>

    <!-- Icon -->

    <div
        class="relative z-10 w-20 h-20 rounded-full flex items-center justify-center"
        [ngClass]="iconBg()">

        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="1.8"
             stroke="currentColor"
             class="w-10 h-10"
             [ngClass]="iconColor()">

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6.253v13m0-13C10.832 5.483 9.246 5 7.5 5S4.168 5.483 3 6.253v13C4.168 18.483 5.754 18 7.5 18s3.332.483 4.5 1.253m0-13C13.168 5.483 14.754 5 16.5 5S19.832 5.483 21 6.253v13C19.832 18.483 18.246 18 16.5 18s-3.332.483-4.5 1.253"/>

        </svg>

    </div>

    <!-- Title -->

    <h3 class="relative z-10 mt-6 text-2xl font-bold text-slate-900">
        {{title()}}
    </h3>

    <!-- Description -->

    <p class="relative z-10 mt-4 text-slate-500 leading-7 flex-1">
        {{subtitle()}}
    </p>

    <!-- Button -->

    <button
        (click)="onExploreClick()"
        type="button"
        class="relative z-10 mt-8 rounded-full border px-6 py-3 font-semibold transition-all duration-300 hover:scale-105 w-fit"
        [ngClass]="buttonColor()">

        {{buttonText()}}

    </button>

    <!-- Bottom Line -->

    <div
        class="absolute bottom-0 left-0 h-1 w-full"
        [ngClass]="lineColor()">
    </div>

</div>
