<div [class]="'relative flex flex-col justify-between p-6 rounded-3xl shadow-sm border border-purple-50/50 min-h-[260px] transition-transform hover:-translate-y-1 duration-200 ' + bgColor()">
  
  <!-- الجزء العلوي: العنوان والوصف محاذيان لليمين -->
  <div class="text-right space-y-2 max-w-[55%]">
    <h3 class="text-2xl font-bold text-indigo-950 leading-snug">
      {{ title() }}
    </h3>
    <p class="text-sm font-medium text-purple-900/70 leading-relaxed">
      {{ subtitle() }}
    </p>
  </div>

  <!-- صورة المرحلة (موضعة على اليسار وبأحجام متناسقة) -->
  <div class="absolute left-3 bottom-6 w-32 h-32 md:w-36 md:h-36 flex items-center justify-center pointer-events-none">
    <img 
      [src]="imageSrc()" 
      [alt]="imageAlt()" 
      class="w-full h-full object-contain drop-shadow-md"
    />
  </div>

  <!-- الزر في الأسفل على اليمين -->
  <div class="mt-6">
    <button 
      (click)="onExploreClick()"
      type="button"
      class="px-5 py-2 text-sm font-bold text-white bg-indigo-700 hover:bg-indigo-800 active:scale-95 transition-all rounded-xl shadow-md shadow-indigo-200 cursor-pointer">
      {{ buttonText() }}
    </button>
  </div>

</div>
