@if (loadingService.isLoading$ | async) {
  <div role="status" aria-live="polite" class="pointer-events-none fixed bottom-6 left-4 z-40 flex items-center gap-3 rounded-2xl border border-purple-100 bg-white px-4 py-3 shadow-lg">
    <img src="images/owl.png" alt="" class="h-8 w-8 object-contain" />
    <span class="text-sm font-bold text-[#3b236d]">{{ 'جارٍ التحميل...' | translate }}</span>
  </div>
  <div aria-hidden="true" class="pointer-events-none fixed top-0 inset-x-0 z-50 h-1 overflow-hidden bg-purple-100"><div class="h-full animate-pulse bg-[#ffc107]"></div></div>
}
