@if (loadingService.isLoading$ | async) {
  <!-- شريط يوتيوب العلوي المتحرك -->
  <div class="fixed top-0 left-0 right-0 h-1.5 bg-purple-100 z-50 overflow-hidden">
    <div class="h-full bg-gradient-to-r from-amber-400 via-purple-600 to-amber-400 animate-youtube-bar"></div>
  </div>

  <!-- خلفية الشاشة والبطاقة المركزية -->
  <div class="fixed inset-0 bg-black/30 backdrop-blur-[2px] z-40 flex items-center justify-center transition-all duration-300">

    <div class="bg-white/95 px-8 py-6 rounded-3xl shadow-2xl border border-purple-100 flex flex-col items-center max-w-xs text-center animate-fade-in">

      <!-- رسوميات SVG المتحركة (شاشة أكاديمية وكتب تتطاير) -->
      <div class="w-32 h-28 relative flex items-center justify-center mb-2">
        <svg class="w-full h-full overflow-visible" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">

          <!-- قاعدة الشاشة / اللابتوب التعليمي -->
          <path d="M70 115H130L140 130H60L70 115Z" fill="#7E22CE" opacity="0.8"/>
          <rect x="50" y="128" width="100" height="6" rx="3" fill="#D8B4FE"/>

          <!-- شاشة العرض الرئيسية (ثابتة مع نبض خفيف) -->
          <rect x="45" y="35" width="110" height="78" rx="8" fill="#581C87" stroke="#FBBF24" stroke-width="3" class="animate-pulse"/>

          <!-- تفاصيل داخل الشاشة (خطوط الشرح) -->
          <rect x="60" y="50" width="55" height="6" rx="3" fill="#FBBF24"/>
          <rect x="60" y="66" width="80" height="4" rx="2" fill="#E9D5FF" opacity="0.6"/>
          <rect x="60" y="78" width="65" height="4" rx="2" fill="#E9D5FF" opacity="0.6"/>
          <circle cx="135" cy="53" r="6" fill="#FBBF24"/>

          <!-- كتاب متحرك 1 (يطير لليمين والأعلى) -->
          <g class="animate-svg-book-1">
            <path d="M100 70C110 65 125 65 135 70V95C125 90 110 90 100 95V70Z" fill="#FBBF24"/>
            <path d="M100 70C90 65 75 65 65 70V95C75 90 90 90 100 95V70Z" fill="#FEF3C7"/>
            <path d="M100 70V95" stroke="#D97706" stroke-width="2"/>
          </g>

          <!-- كتاب متحرك 2 (يطير لليسار والأعلى بلون بنفسجي) -->
          <g class="animate-svg-book-2">
            <rect x="85" y="60" width="30" height="22" rx="3" fill="#9333EA"/>
            <path d="M92 68H108M92 74H102" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- نجوم وبريق متحرك -->
          <path d="M35 45L38 52L45 55L38 58L35 65L32 58L25 55L32 52L35 45Z" fill="#FBBF24" class="animate-svg-star-1"/>
          <path d="M165 30L167 35L172 37L167 39L165 44L163 39L158 37L163 35L165 30Z" fill="#9333EA" class="animate-svg-star-2"/>

        </svg>
      </div>

      <!-- النصوص التوضيحية -->
      <h3 class="text-gray-800 font-bold text-base mb-1">جارٍ تحميل البيانات...</h3>
      <!-- <p class="text-gray-400 text-xs">نجهّز لك محتوى الأكاديمية الذكي 🎓</p> -->

    </div>
  </div>
}
